name: Refresh NACS Live Status (5m)

on:
  schedule:
    # 5분마다 최근 10분 내 상태 변경분만 조회해 반영 (~300~600호출/일, 커밋 없음)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment: 환경부키
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.status.outputs.updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Patch recent 10m charger statuses
        id: status
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.ENVIROMENT_GOV || secrets.DATA_GO_KR_API_KEY }}
          LIVE_DATA_URL: https://mhsong282828221212123123123.github.io/CT-NACS-MAP/data/nacs.json
        run: node scripts/update-nacs-status.mjs

      - name: Install dependencies
        if: steps.status.outputs.updated == 'true'
        run: npm ci

      - name: Build web app
        if: steps.status.outputs.updated == 'true'
        env:
          VITE_NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID || vars.NAVER_MAP_CLIENT_ID }}
        run: npm run build

      - name: Setup Pages
        if: steps.status.outputs.updated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.status.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.updated == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
