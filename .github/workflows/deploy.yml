name: Deploy NACS Map on Code Push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/nacs.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    environment: 환경부키
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh NACS dataset (master if sample, else 10m status)
        continue-on-error: true
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.ENVIROMENT_GOV || secrets.DATA_GO_KR_API_KEY }}
          LIVE_DATA_URL: https://mhsong282828221212123123123.github.io/CT-NACS-MAP/data/nacs.json
        run: |
          IS_SAMPLE=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('public/data/nacs.json','utf8'));console.log(Boolean(d.isSample))")
          if [ "$IS_SAMPLE" = "true" ]; then
            node scripts/fetch-nacs.mjs
          else
            node scripts/update-nacs-status.mjs
          fi

      - name: Build web app
        env:
          VITE_NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID || vars.NAVER_MAP_CLIENT_ID }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
